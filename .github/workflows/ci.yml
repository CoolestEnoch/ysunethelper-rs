name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Exercise TLS and portal status through a local mock
        if: runner.os == 'Linux'
        run: |
          python3 tests/embedded_smoke.py target/debug/ysunethelper
          python3 tests/compatibility.py --rust target/debug/ysunethelper
  workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
      - name: Check release packaging
        run: python3 tests/release_workflow.py
      - name: Check shell and Python syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py tests/*.py
